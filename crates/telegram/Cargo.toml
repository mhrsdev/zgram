[package]
name = "zerogram-telegram"
version = "0.1.0"
edition = "2021"
description = "Telegram transport for Zerogram on top of TDLib"

[features]
# Default: build script downloads a prebuilt TDLib.
default = ["download"]
download = ["tdlib-rs/download-tdlib"]
# Use a TDLib you already have: set LOCAL_TDLIB_PATH to its folder (contains lib/ and include/).
local = ["tdlib-rs/local-tdlib"]

[dependencies]
tdlib-rs = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[build-dependencies]
tdlib-rs = { version = "1.4", default-features = false }
