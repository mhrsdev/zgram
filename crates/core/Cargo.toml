[package]
name = "zerogram-core"
version = "0.1.0"
edition = "2021"
description = "Transport-agnostic core of Zerogram: event envelope, per-group crypto, compact text encoding, chunking and merge log"

[dependencies]
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
thiserror = "1"
